---
name: unit

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: unit-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rspec:
    name: rspec (ruby ${{ matrix.ruby }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
    runs-on: ${{ matrix.os }}
    env:
      BUNDLE_WITHOUT: debug:docs
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec
